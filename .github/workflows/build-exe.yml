name: build-windows-exe

# 没有 Windows 电脑时，用 GitHub 免费 Windows 运行器打包：
# 仓库 → Actions → build-windows-exe → Run workflow
# 完成后在该次运行的 Artifacts 里下载 Excel公式转数值-windows.zip
#
# 2026-10 修复记录（上一次运行第 6 步"打包单文件 exe"失败、第 17 步 Node.js 20 弃用警告）：
#   1. 强制 UTF-8：Windows 运行器 stdout 是管道，默认 cp1252，PyInstaller 打印中文路径即崩溃；
#   2. 续行符改数组：不再用 PowerShell 反引号续行，避免参数被截断导致 pyinstaller 收不到脚本名；
#   3. 内部包名改 ASCII（XlsxFormulaToValue），中文名打包后重命名，彻底绕开编码问题；
#   4. 图标改用纯 BMP 条目的 ico，且带图标失败时自动回退无图标重试；
#   5. actions 全部升级到 Node 24 版本：checkout@v5 / setup-python@v6 / upload-artifact@v5。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  PYTHONLEGACYWINDOWSSTDIO: '0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 环境信息
        run: |
          python -V
          python -c "import sys; print('stdout encoding =', sys.stdout.encoding); print('fs encoding =', sys.getfilesystemencoding())"
          Get-ChildItem -Name

      - name: 安装 PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          pyinstaller --version

      - name: 校验脚本语法与 tkinter
        run: |
          python -m py_compile xlsx_deformula.py
          python -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"

      - name: 引擎自检（公式转数值/图片保留/源文件不变）
        run: python selftest.py

      # 单行命令 + ASCII 内部名；带图标失败自动无图标重试
      - name: 打包单文件 exe
        shell: pwsh
        run: |
          $common = @('--noconfirm','--clean','--onefile','--windowed',
                      '--name','XlsxFormulaToValue',
                      '--distpath','dist','--workpath','build','--specpath','build',
                      'xlsx_deformula.py')
          if (Test-Path "icon.ico") {
            Write-Host ">>> 第 1 次尝试：带图标打包"
            pyinstaller @common --icon icon.ico
          }
          if (-not (Test-Path "dist/XlsxFormulaToValue.exe")) {
            Write-Host ">>> 第 2 次尝试：去掉图标重新打包（规避图标格式问题）"
            Remove-Item -Recurse -Force dist,build -ErrorAction SilentlyContinue
            pyinstaller @common
          }
          if (-not (Test-Path "dist/XlsxFormulaToValue.exe")) {
            Write-Error "打包失败：dist 下没有生成 exe"
            exit 1
          }
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: 重命名为中文并检查体积
        shell: pwsh
        run: |
          Copy-Item "dist/XlsxFormulaToValue.exe" "dist/Excel公式转数值.exe" -Force
          $len = (Get-Item "dist/XlsxFormulaToValue.exe").Length
          Write-Host ("exe 大小: {0:N1} MB" -f ($len / 1MB))
          if ($len -lt 5MB) {
            Write-Error "exe 体积异常（小于 5MB），可能缺少运行库"
            exit 1
          }

      # 真机冒烟测试：用打包好的 exe 跑一遍命令行业务流程，再校验产物
      - name: 冒烟测试（exe 实跑一次）
        shell: pwsh
        run: |
          python selftest.py --make-sample smoke.xlsx
          & "dist/XlsxFormulaToValue.exe" --cli smoke.xlsx smoke_out.xlsx
          if ($LASTEXITCODE -ne 0) { Write-Error "exe 处理失败，退出码 $LASTEXITCODE"; exit 1 }
          if (-not (Test-Path "smoke_out.xlsx")) { Write-Error "exe 没有生成输出文件"; exit 1 }
          python selftest.py --verify smoke_out.xlsx
          if ($LASTEXITCODE -ne 0) { Write-Error "产物校验失败"; exit 1 }

      - name: 失败时收集构建线索
        if: failure()
        shell: pwsh
        run: |
          Write-Host "==== build 目录 ===="
          Get-ChildItem -Recurse build -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize
          Get-ChildItem build -Recurse -Include "warn-*.txt","xref-*.html" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "---- $($_.FullName) ----"; Get-Content $_.FullName -TotalCount 100 }

      - uses: actions/upload-artifact@v5
        with:
          name: Excel公式转数值-windows
          path: dist/Excel公式转数值.exe
