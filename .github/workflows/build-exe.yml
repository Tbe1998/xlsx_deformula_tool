name: build-windows-exe

# Windows 云端打包（只产出单文件 exe，不产生目录）。
# 仓库 → Actions → build-windows-exe → Run workflow
# 产物：Artifacts 里的 Excel公式转数值-windows.zip（内含单个 Excel公式转数值.exe）
#
# 约定（本工作流的硬性要求）
# ---------------------------------------------------------------------------
# 1. 只接受 **单文件（--onefile）** 产物：成功条件 = 退出码 0 且 dist 下产出
#    XlsxFormulaToValue.exe 这个文件，并且不出现同名目录（一旦出现目录即判定失败）；
# 2. 依次尝试多套 onefile 配置，记录每一套的退出码，只用退出码 0 的那一套的产物；
# 3. 任务摘要用 GitHub Actions 的 job summary（$GITHUB_STEP_SUMMARY）在运行时生成。
#    https://docs.github.com/actions/using-workflows/workflow-commands-for-github-actions#adding-a-job-summary
# 4. 冒烟测试必须用 Start-Process -Wait -PassThru 调 exe：
#    --windowed 产物是 GUI 子系统程序，直接 & 调用 PowerShell **不会等待**，
#    会误判成"没有生成输出文件"。
#
# 历史修复记录
# ---------------------------------------------------------------------------
# ① stdout 管道默认 cp1252 → 强制 UTF-8，内部包名用 ASCII，打包后改中文名；
# ② PowerShell 反引号续行截断参数 → 改数组一次调用；
# ③ 图标 ico 原为 PNG 条目 → 改纯 BMP 条目（make_ico.py）；
# ④ Defender 锁 exe（[WinError 5]）→ 构建前加排除项；
# ⑤ 只保留单文件配置，逐套记录退出码，成功条件三合一（退出码0 + 产物是文件 + 无同名目录）；
# ⑥ 冒烟测试 & 同步误判 → 改 Start-Process -Wait -PassThru 并轮询输出文件；
# ⑧ 拖拽导入：界面依赖 tkinterdnd2(tkdnd) → 打包时 --collect-all tkinterdnd2，
#    并新增「--check-dnd」自检步骤，确认组件真的进了 exe（否则拖拽不可用）；
# ⑦ Node.js 20 弃用 → 全部动作升级到 Node 24 版本（checkout@v7 / setup-python@v7 / upload-artifact@v7）。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  PYTHONLEGACYWINDOWSSTDIO: '0'
  PYINSTALLER_NAME: XlsxFormulaToValue

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 环境信息（写入任务摘要）
        shell: pwsh
        run: |
          $summary = $env:GITHUB_STEP_SUMMARY
          $pyver = (python -V 2>&1)
          $enc = (python -c "import sys; print(sys.stdout.encoding)" 2>&1)
          $fsenc = (python -c "import sys; print(sys.getfilesystemencoding())" 2>&1)
          $free = (Get-PSDrive C | Select-Object -ExpandProperty Free)

          Add-Content -Path $summary -Value "## Excel 公式转数值工具 — Windows 打包"
          Add-Content -Path $summary -Value ""
          Add-Content -Path $summary -Value "| 项目 | 值 |"
          Add-Content -Path $summary -Value "| --- | --- |"
          Add-Content -Path $summary -Value "| 运行器 | ``windows-latest`` |"
          Add-Content -Path $summary -Value "| 提交 | ``$env:GITHUB_SHA`` |"
          Add-Content -Path $summary -Value "| Python | $pyver |"
          Add-Content -Path $summary -Value "| stdout 编码 | $enc |"
          Add-Content -Path $summary -Value "| 文件系统编码 | $fsenc |"
          Add-Content -Path $summary -Value ("| C 盘可用 | {0:N1} GB |" -f ($free / 1GB))
          Add-Content -Path $summary -Value ""
          Get-ChildItem -Name

      - name: 安装 PyInstaller 与拖拽组件
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # 优先使用已验证版本，失败再退回最新版
          python -m pip install "pyinstaller==6.22.3" tkinterdnd2
          if ($LASTEXITCODE -ne 0) {
            Write-Host "固定版本安装失败，退回最新版"
            python -m pip install pyinstaller tkinterdnd2
          }
          pyinstaller --version
          python -c "import PyInstaller, sys; print('PyInstaller', PyInstaller.__version__, '| Python', sys.version.split()[0])"
          python -c "import tkinterdnd2, os; print('tkinterdnd2 OK ->', os.path.dirname(tkinterdnd2.__file__))"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=缺少拖拽组件::tkinterdnd2 安装失败，打出来的 exe 将不支持拖拽"
            exit 1
          }

      - name: 关闭 Defender 对工作目录的实时扫描
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -ErrorAction Stop
            Write-Host "已把 $env:GITHUB_WORKSPACE 加入 Defender 排除项"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Defender 排除项：已添加 ``$env:GITHUB_WORKSPACE``"
          } catch {
            Write-Host "无法修改 Defender 设置（不影响继续构建）：$($_.Exception.Message)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Defender 排除项：未能设置（$($_.Exception.Message)），继续构建"
          }

      - name: 校验脚本语法与 tkinter
        run: |
          python -m py_compile xlsx_deformula.py
          python -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"

      - name: 引擎自检（公式转数值/图片保留/源文件不变）
        run: python selftest.py

      # 只跑单文件配置；逐套记录退出码，取退出码 0 且产出为文件（无同名目录）的那一套
      - name: 打包单文件 exe（逐套尝试并记录退出码）
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $name    = $env:PYINSTALLER_NAME
          $summary = $env:GITHUB_STEP_SUMMARY

          # 全部是 --onefile 配置，绝不使用 --onedir
          # 全部带上 --collect-all tkinterdnd2，确保拖拽组件（tkdnd）打进 exe
          $attempts = @(
            @{ id = 'onefile';         extra = @('--collect-all','tkinterdnd2') },
            @{ id = 'onefile-retry';   extra = @('--collect-all','tkinterdnd2') },
            @{ id = 'onefile-icon';    extra = @('--collect-all','tkinterdnd2','--icon','icon.ico') },
            @{ id = 'onefile-noupx';   extra = @('--collect-all','tkinterdnd2','--noupx') }
          )

          Add-Content -Path $summary -Value ""
          Add-Content -Path $summary -Value "## 打包尝试记录（仅单文件配置）"
          Add-Content -Path $summary -Value ""
          Add-Content -Path $summary -Value "| # | 配置 | 退出码 | 产物文件 | 误建目录 | 结论 |"
          Add-Content -Path $summary -Value "| --- | --- | --- | --- | --- | --- |"

          Remove-Item build_mode.txt,build_success.log -Force -ErrorAction SilentlyContinue
          $okId = $null
          $idx = 0
          foreach ($a in $attempts) {
            $idx++
            Remove-Item -Recurse -Force dist,build -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2

            $log  = "build_$($a.id).log"
            $argv = @('--noconfirm','--clean','--onefile','--windowed','--name',$name) + $a.extra + @('xlsx_deformula.py')
            Write-Host ">>> [$idx] 尝试 $($a.id): pyinstaller $($argv -join ' ')"
            & pyinstaller @argv 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE

            $exe = "dist/$name.exe"
            $hasExe = (Test-Path $exe -PathType Leaf)
            $hasDir = (Test-Path "dist/$name" -PathType Container)
            $pass   = ($code -eq 0 -and $hasExe -and -not $hasDir)

            $verdict = '❌ 退出码非 0'
            if ($pass)            { $verdict = '✅ 采用' }
            elseif ($hasDir)      { $verdict = '❌ 产生了目录（不符合只输出单文件的要求）' }
            elseif (-not $hasExe) { $verdict = '❌ 无单文件产物' }
            Add-Content -Path $summary -Value "| $idx | ``$($a.id)`` | $code | $hasExe | $hasDir | $verdict |"
            Write-Host "    退出码=$code 产物文件=$hasExe 目录=$hasDir => $verdict"

            if ($pass) {
              $okId = $a.id
              break
            }
            Add-Content -Path $summary -Value ""
            Add-Content -Path $summary -Value "<details><summary>[$($a.id)] 日志尾部 80 行</summary>"
            Add-Content -Path $summary -Value ""
            Add-Content -Path $summary -Value '~~~'
            Add-Content -Path $summary -Value (Get-Content $log -Tail 80 | Out-String)
            Add-Content -Path $summary -Value '~~~'
            Add-Content -Path $summary -Value ""
            Add-Content -Path $summary -Value '</details>'
          }

          if (-not $okId) {
            Add-Content -Path $summary -Value ""
            Add-Content -Path $summary -Value "**结论：全部单文件配置均失败，未产出 exe。**"
            Write-Output "::error title=打包失败::所有 --onefile 配置均未成功（详见任务摘要与 build_*.log）"
            exit 1
          }

          "mode=$okId" | Out-File -FilePath build_mode.txt -Encoding utf8
          Copy-Item $log build_success.log -Force -ErrorAction SilentlyContinue
          Add-Content -Path $summary -Value ""
          Add-Content -Path $summary -Value "**成功配置：``$okId``，退出码 0，产物：``dist/$name.exe``（单文件）**"
          Write-Host "::notice title=打包成功::配置=$okId 退出码=0 产物=dist/$name.exe"
          Get-ChildItem dist -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: 生成中文名单文件产物并校验
        shell: pwsh
        run: |
          $name    = $env:PYINSTALLER_NAME
          $summary = $env:GITHUB_STEP_SUMMARY
          $src = "dist/$name.exe"
          if (-not (Test-Path $src -PathType Leaf)) {
            Write-Output "::error title=缺少产物::dist/$name.exe 不存在"
            exit 1
          }
          if (Test-Path "dist/$name" -PathType Container) {
            Write-Output "::error title=产物不符::出现了目录 dist/$name，要求只输出单个文件"
            exit 1
          }
          Copy-Item $src "dist/Excel公式转数值.exe" -Force
          Remove-Item $src -Force          # 只保留中文名那一个文件
          $len = (Get-Item "dist/Excel公式转数值.exe").Length
          Write-Host ("单文件 exe 大小: {0:N1} MB" -f ($len / 1MB))
          Add-Content -Path $summary -Value ""
          Add-Content -Path $summary -Value ("- 产物：``dist/Excel公式转数值.exe``，{0:N1} MB（单文件，无目录）" -f ($len / 1MB))
          if ($len -lt 5MB) {
            Write-Output "::error title=体积异常::exe 小于 5MB，可能缺少运行库"
            exit 1
          }
          $extra = Get-ChildItem dist -File | Where-Object { $_.Name -ne 'Excel公式转数值.exe' }
          if ($extra) { Write-Host ("dist 下其他文件（不上传）：" + (($extra | ForEach-Object Name) -join ', ')) }

      - name: 校验拖拽组件已打进 exe
        shell: pwsh
        run: |
          $summary = $env:GITHUB_STEP_SUMMARY
          $exe = (Resolve-Path "dist/Excel公式转数值.exe" -ErrorAction Stop).Path
          $p = Start-Process -FilePath $exe -ArgumentList @('--check-dnd') -Wait -PassThru
          $code = $p.ExitCode
          Write-Host "拖拽组件自检退出码: $code（0=可用，3=不可用）"
          if ($code -eq 0) {
            Add-Content -Path $summary -Value "- 拖拽组件：✅ 已打包进 exe（tkdnd 可用）"
            Write-Host "::notice title=拖拽组件可用::exe 内 tkdnd 正常"
          } else {
            Add-Content -Path $summary -Value "- 拖拽组件：❌ 未打进 exe（退出码 $code），拖拽不可用"
            Write-Output "::error title=拖拽组件缺失::exe 里没有 tkdnd，拖拽功能不可用（请检查 --collect-all tkinterdnd2）"
            exit 1
          }

      # --windowed 产物是 GUI 子系统程序：直接 & 调用不会等待，必须 Start-Process -Wait
      - name: 冒烟测试（单文件产物实跑一次）
        shell: pwsh
        run: |
          $summary = $env:GITHUB_STEP_SUMMARY
          $exe = (Resolve-Path "dist/Excel公式转数值.exe" -ErrorAction Stop).Path
          Write-Host "被测程序: $exe"

          python selftest.py --make-sample smoke.xlsx
          if (-not (Test-Path "smoke.xlsx" -PathType Leaf)) {
            Add-Content -Path $summary -Value "- 冒烟测试：❌ 未能生成测试样例"
            Write-Output "::error title=冒烟测试失败::未能生成测试样例 smoke.xlsx"
            exit 1
          }
          Remove-Item smoke_out.xlsx,smoke_diag.xlsx,diag.log -Force -ErrorAction SilentlyContinue

          $code = -1
          $startErr = ''
          try {
            $p = Start-Process -FilePath $exe -ArgumentList @('--cli','smoke.xlsx','smoke_out.xlsx') `
                               -WorkingDirectory (Get-Location).Path -Wait -PassThru
            $code = $p.ExitCode
            Write-Host "exe 退出码: $code"
          } catch {
            $startErr = $_.Exception.Message
            Write-Host "启动失败: $startErr"
          }

          # 轮询输出文件，最多等 20 秒（GUI 程序的文件写入与进程退出可能有毫秒级错位）
          $deadline = (Get-Date).AddSeconds(20)
          while (-not (Test-Path "smoke_out.xlsx" -PathType Leaf) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          $hasOut = (Test-Path "smoke_out.xlsx" -PathType Leaf)

          if ($code -eq 0 -and $hasOut) {
            python selftest.py --verify smoke_out.xlsx
            if ($LASTEXITCODE -ne 0) {
              Add-Content -Path $summary -Value "- 冒烟测试：❌ 产物校验不通过（公式/数值/图片单元格校验失败）"
              Write-Output "::error title=冒烟测试失败::产物校验不通过"
              exit 1
            }
            $size = (Get-Item "smoke_out.xlsx").Length
            Add-Content -Path $summary -Value "- 冒烟测试：✅ 单文件 exe 实跑通过（退出码 0，输出 ${size} 字节，公式已转数值、图片单元格保留、源文件未改动）"
            Write-Host "::notice title=冒烟测试通过::exe 退出码 0，输出 smoke_out.xlsx $size 字节"
            exit 0
          }

          # ---- 失败诊断：临时构建一个 --console 版本，把真实报错抓出来写进摘要 ----
          Add-Content -Path $summary -Value ""
          Add-Content -Path $summary -Value "### 冒烟测试失败诊断"
          Add-Content -Path $summary -Value ""
          Add-Content -Path $summary -Value "- exe 退出码：``$code``；输出文件存在：``$hasOut``；启动异常：``$startErr``"
          try {
            Write-Host ">>> 构建 --console 诊断版本以取得报错输出"
            & pyinstaller --noconfirm --clean --onefile --console --name diag `
                --distpath diag --workpath diagbuild --specpath diagbuild xlsx_deformula.py 2>&1 |
                Tee-Object -FilePath diag_build.log | Out-Null
            if (Test-Path "diag/diag.exe") {
              $dp = Start-Process -FilePath (Resolve-Path "diag/diag.exe").Path `
                                  -ArgumentList @('--cli','smoke.xlsx','smoke_diag.xlsx') `
                                  -WorkingDirectory (Get-Location).Path -Wait -PassThru `
                                  -RedirectStandardOutput diag_stdout.txt -RedirectStandardError diag_stderr.txt
              Write-Host "诊断版退出码: $($dp.ExitCode)"
              Add-Content -Path $summary -Value "- 诊断版（--console）退出码：``$($dp.ExitCode)``"
              foreach ($f in 'diag_stdout.txt','diag_stderr.txt') {
                if (Test-Path $f) {
                  Add-Content -Path $summary -Value ""
                  Add-Content -Path $summary -Value ("<details><summary>$f</summary>")
                  Add-Content -Path $summary -Value ""
                  Add-Content -Path $summary -Value '~~~'
                  Add-Content -Path $summary -Value (Get-Content $f -Tail 60 | Out-String)
                  Add-Content -Path $summary -Value '~~~'
                  Add-Content -Path $summary -Value "</details>"
                }
              }
            } else {
              Add-Content -Path $summary -Value "- 诊断版构建失败，见 diag_build.log"
              Add-Content -Path $summary -Value '~~~'
              Add-Content -Path $summary -Value (Get-Content diag_build.log -Tail 40 | Out-String)
              Add-Content -Path $summary -Value '~~~'
            }
          } catch {
            Add-Content -Path $summary -Value "- 诊断过程本身出错：``$($_.Exception.Message)``"
          }
          Write-Output "::error title=冒烟测试失败::exe 未成功运行或未生成输出文件（退出码 $code，输出文件=$hasOut）"
          exit 1

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: Excel公式转数值-windows
          path: dist/Excel公式转数值.exe
          if-no-files-found: error

      - name: 上传构建日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            build_*.log
            build/warn-*.txt
            build_mode.txt
            diag_build.log
            diag_stdout.txt
            diag_stderr.txt
          if-no-files-found: warn

      - name: 任务摘要收尾
        if: always()
        shell: pwsh
        run: |
          $summary = $env:GITHUB_STEP_SUMMARY
          $status = if ('${{ job.status }}' -eq 'success') { '✅ 成功' } else { '❌ 失败' }
          Add-Content -Path $summary -Value ""
          Add-Content -Path $summary -Value "---"
          Add-Content -Path $summary -Value "**运行结果：$status** ｜ 产物要求：单个 exe 文件（不建目录）｜ 源文件只读，处理结果另存"
